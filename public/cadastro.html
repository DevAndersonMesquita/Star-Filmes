<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarFilmes - Login</title>
  <script src="./script.js"></script>
  <link rel="stylesheet" href="/assets/CSS/login.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <h1>Star<span>Filmes</span></h1>
    </div>

    <nav class="nav-links">
      <a href="/indexcine.html">Início</a>
      <a href="./login.html" class="active">Login</a>
      <a href="./contato.html">Contato</a>
    </nav>

    <div class="search-box">
      <input type="search" placeholder="Digite seu filme...">
    </div>
  </header>

  <section class="container">
    <div class="frm">
      <form id="formCadastro" >
        
        <h2>Cadastre-se</h2>
        <input class="input" name="nome" id="nome" type="text" placeholder="Nome completo">
        <input class="input" name="date" id="date" type="date" placeholder="Data de Nascimento">
        <input class="input" name="cpf" id="cpf" type="text" placeholder="CPF">
        <input class="input" name="email" id="email" type="text" placeholder="E-mail">
        <input class="input" name="senha" id="senha" type="password" placeholder="Senha">
        <p class="frm-cadastro">Já tem uma conta? <a href="login.html">Faça login</a></p>
        <button type="button" onclick="cadastrar()" >Cadastrar</button>
      </form>
    </div>
  </section>

  





</body>
</html>
