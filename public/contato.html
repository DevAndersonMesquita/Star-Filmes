<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> StarFilmes - Contato</title>
    <link rel="stylesheet" href="/assets/CSS/contato.css">
</head>
<body>
     <header class="navbar">
    <div class="logo">
      <h1 onclick="window.location.href='/public/indexcine.html'">Star<span>Filmes</span></h1>
    </div>

    <nav class="nav-links">
      <a href="/contato.html">Contato</a>
        <a href="/sobre.html">Sobre</a>
        
      <div class="search-box">
          <input type="search" placeholder="Digite seu filme...">
        </div>
    </nav>
  </header>
<section class="contato-section">

    <h1 class="titulo-contato">Contato</h1>
    <p class="subtitulo">
        Fale com a equipe StarFilmes
    </p>

    <div class="contato-container">

        <!-- FORMULÁRIO -->
        <div class="formulario">

            <h2>Envie uma mensagem</h2>

            <input type="text"
                   placeholder="Seu nome">

            <input type="email"
                   placeholder="Seu email">

            <textarea
                placeholder="Digite sua mensagem">
            </textarea>

            <button>
                Enviar Mensagem
            </button>

        </div>

    </div>

</section>
<footer>
    <p>© 2024 StarFilmes. Todos os direitos reservados.</p>
</footer>
</body>
</html>
