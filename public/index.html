<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarFilmes - Login</title>
  <script src="script.js" defer ></script>
  <link rel="stylesheet" href="/public/assets/CSS/login.css" defer>
</head>
<body>

  <div class="logo">
    <h1 onclick="window.location.href='/public/index.html'">Star<span>Filmes</span></h1>
  </div>

  <section class="container">
    <div class="frm">
      <form id="formLogin">
        
        <h2>Entrar na sua conta</h2>
        <input class="input" name="email" id="email" type="text" placeholder="E-mail ou CPF">
        <input class="input" name="senha" id="senha" type="password" placeholder="Senha">
        <p class="frm-cadastro">Nao tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
        <button type="button" id="btnLogin" onclick="entrar()"  >Entrar</button>
      </form>
    </div>
  </section>

  





</body>
</html>
