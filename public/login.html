<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarFilmes - Login</title>
  <script src="script.js"></script>
  <link rel="stylesheet" href="/assets/CSS/login.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <h1>Star<span>Filmes</span></h1>
    </div>

    <nav class="nav-links">
      <a href="/indexcine.html">Início</a>
      <a href="./login.html" class="active">Login</a>
      <a href="./contato.html">Contato</a>
    </nav>

    <div class="search-box">
      <input type="search" placeholder="Digite seu filme...">
    </div>
  </header>

  <section class="container">
    <div class="frm">
      <form id="formLogin">
        
        <h2>Entrar na sua conta</h2>
        <input class="input" name="email" id="email" type="text" placeholder="E-mail ou CPF">
        <input class="input" name="senha" id="senha" type="password" placeholder="Senha">
        <p class="frm-cadastro">Nao tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
        <button type="button" id="btnLogin" onclick="entrar()"  >Entrar</button>
      </form>
    </div>
  </section>

  





</body>
</html>
